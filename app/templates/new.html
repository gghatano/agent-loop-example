{% extends "base.html" %}
{% block title %}新規登録{% endblock %}
{% block content %}
<div class="toolbar"><h1>新規登録</h1></div>
<form class="card" method="post" action="#">
<div class="field"><label for="name">案件名</label><input id="name" name="name" required></div>
<div class="field"><label for="client">顧客</label><input id="client" name="client" required></div>
<div class="field"><label for="status">状態</label>
<select id="status" name="status"><option value="active">進行中</option><option value="paused">保留</option><option value="closed">完了</option></select></div>
<div class="field"><label for="budget">予算（円）</label><input id="budget" name="budget" inputmode="numeric"><div class="hint">税抜・整数で入力</div></div>
<div class="field"><label for="start">開始日</label><input id="start" name="start" type="date"></div>
<div class="field"><label for="end">終了日</label><input id="end" name="end" type="date"></div>
<div class="actions"><a class="btn" href="/projects">キャンセル</a><button class="btn primary" type="submit">登録</button></div>
</form>
{% endblock %}
