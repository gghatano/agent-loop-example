{% extends "base.html" %}
{% block title %}案件一覧{% endblock %}
{% block content %}
<div class="toolbar"><h1>案件一覧</h1><a class="btn primary" href="/projects/new">＋ 新規登録</a></div>
<table>
<thead><tr><th>ID</th><th>案件名</th><th>顧客</th><th>状態</th><th>担当</th><th class="num">予算</th><th>期間</th></tr></thead>
<tbody>
{% for p in projects %}<tr><td>{{ p.id }}</td><td><a href="/projects/{{ p.id }}">{{ p.name }}</a></td><td>{{ p.client }}</td><td><span class="badge {{ p.status }}">{{ p.status | status_label }}</span></td><td>{{ p.owner }}</td><td class="num">{{ p.budget | yen }}</td><td>{{ p | period }}</td></tr>
{% endfor %}</tbody>
</table>
{% endblock %}
