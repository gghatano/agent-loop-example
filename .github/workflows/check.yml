name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - run: uv sync && uv run playwright install --with-deps chromium
      - run: ./scripts/check.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-log
          path: |
            .agent/check.log
            .agent/vrt/
